# libinput-gestures - Ubuntu 26.04 / GNOME 50 / Wayland
# Your touchegg layout, rebuilt for this machine.
#
# INJECTION: nyx-keyd holds ONE XDG RemoteDesktop portal session open and
# injects chords over libei in ~30ms. nyx-key is a thin client. This replaced
# wdotool/ydotool because mutter silently drops /dev/uinput key events.
#
# GNOME shortcuts backing these chords. All are MODIFIER+F-key, never bare
# F-key: injected bare F-keys never reach mutter.
#   super+shift+Left / Right   move-to-side-w / -e  (tile left/right half)
#   alt+F9   toggle-fullscreen      alt+F12  show-desktop
#   alt+F4   close window           alt+F8   begin-resize
#   super+Tab  switch applications
#   super+alt+Left/Right  switch workspace
#   alt+F19  show-screen-recording-ui (was Ctrl+Shift+Alt+R, moved so a
#            gesture can trigger it)
#
# ANIMATION: tiling (alt+F13/F14) and fullscreen (alt+F9) are GNOME's OWN
# actions with enable-tile-animations=true, so they animate natively - the
# same translucent box you get dragging a window to a screen edge.
#
# SCREENSHOTS: use nyshot (flameshot + wl-copy). It ALWAYS puts the PNG on the
# clipboard, because flameshot's own -c left only a text type on this Wayland
# build. Do NOT recreate ~/.config/flameshot/flameshot.ini - this v13 build
# rejects every setting key ("Unrecognized setting").
#
# FLASH/SOUND: org.gnome.desktop.sound event-sounds + input-feedback-sounds
# are set false. The capture flash comes from the portal compositor, not from
# a settable key.
#
# MEASURED LIMITS of this ELAN06FA pad: max 4 fingers, so 5-finger gestures
# cannot exist. This build has no 'tap' gesture - only swipe/pinch/hold.

# ---- 3-finger swipe: TILE window left/right (animated), switcher, resize ----
# Tiling chords are super+shift+Left / super+shift+Right, which are GNOME's own
# move-to-side-w / move-to-side-e. These animate natively with
# enable-tile-animations=true, so they are the animated path.
#
# HISTORY / BUG FIXED 2026-10-03: these two lines used to inject
# alt+shift+F9 / alt+shift+F10, which are bound to NOTHING - both gestures were
# silently dead and fired into the void. Do not reintroduce F-keys here.
# Do NOT use super+Left / super+Right either: tiling-assistant@ubuntu.com owns
# those and forces org.gnome.mutter.keybindings.toggle-tiled-* to empty.
# alt+F13/F14 also fire into nothing - verified dead.
# 3F horizontal: tile to half screen (super+Left/Right = toggle-tiled, real resize)
gesture swipe left  3  /usr/local/bin/nyx-key super+Left
gesture swipe right 3  /usr/local/bin/nyx-key super+Right
gesture swipe up    3  /usr/local/bin/nyx-key super+Tab
gesture swipe down  3  /usr/local/bin/nyx-key alt+F8

# ---- 4-finger swipe: switch workspace / fullscreen / show desktop ----
# CONFIRMED WORKING 2026-10-03 by the user on real hardware. The 4-finger
# directions are deliberately crossed - swipe LEFT sends super+alt+Right
# (workspace right) and swipe RIGHT sends super+alt+Left. This is opposite to
# GNOME's own 4-finger swipe and looks like a mistake when you read it, so
# here is why it stays:
#   * libinput-gestures defines "swipe left" purely as raw dx < 0, i.e. fingers
#     physically moved left (verified on a virtual touchpad with
#     dev/gesturesynth.c: net dx = -194 for fingers moved left).
#   * The crossing was tested on hardware and felt right, so it is a preference,
#     not a defect. Do not "fix" it.
# To reverse it, swap the two chords below.
gesture swipe left  4  /usr/local/bin/nyx-key super+alt+Right
gesture swipe right 4  /usr/local/bin/nyx-key super+alt+Left
gesture swipe up    4  /usr/local/bin/nyx-key alt+F9
gesture swipe down  4  /usr/local/bin/nyx-key alt+F12

# ---- 2-finger pinch: DISABLED. There is nothing to bind it to. ----
# Was kp_subtract / kp_add, and both of those keycodes are bound to nothing in
# GNOME, so the gesture fired into the void - verified by auditing every
# chord in this file against org.gnome.desktop.wm.keybindings and
# org.gnome.shell.keybindings.
# This is not a binding mistake that a better chord could fix: mutter 50 has no
# zoom API at all. Meta.Window has no meta_window_zoom (it is absent from every
# maintained mutter branch), no set_size - only move_resize_frame - and there is
# no compositor scale-to-fit. The magnifier can zoom, but it magnifies
# screen contents via ZoomRegions, not a window, and forcing it on calls
# compositor.disable_unredirect() so it costs real performance.
# Leaving these commented out keeps the config honest: 12 working gestures.
# gesture pinch in    2  /usr/local/bin/nyx-key kp_subtract
# gesture pinch out   2  /usr/local/bin/nyx-key kp_add

# Injection backend: nyx-key defaults to libei over the RemoteDesktop portal on
# Wayland, and every line in this file relies on that default. Do NOT pin
# NYX_INJECT_BACKEND=xdotool anywhere - see the note below the 3F pinch block
# for why xdotool is a silent no-op here.
#
# The portal's Start call can hang (measured 23 failures / 157 successes, each a
# 30s timeout), but that only affects INLINE sessions - i.e. when nyx-keyd is not
# running or is wedged. nyx-keyd holds ONE portal session open for the entire
# login and serves injection over a unix socket in ~0.09s, so in normal use no
# portal call happens per gesture.
#
# ---- 3-finger pinch: OUT = full screenshot (saved + clipboard),
#                      IN  = close focused app ----
# BUG FIXED 2026-10-03: these two lines (and the 4F ones below) pinned
# NYX_INJECT_BACKEND=xdotool. That pin is what broke screenshots, and the
# reasoning behind it was wrong.
#
# xdotool injects via XTest into XWayland. It reports SUCCESS (exit 0) but the
# event never reaches the Wayland compositor's shortcut handling, so GNOME's
# alt+F5 screenshot binding never fires and no file is written. Verified by A/B
# on the same chord: xdotool -> exit 0, no file; libei -> exit 0, file written.
# A silent no-op that reports success is worse than an outright failure.
#
# libei is the correct backend on Wayland: it injects at the libinput/mutter
# level, so compositor keybindings fire exactly as for a real keypress.
# The original worry was that the RemoteDesktop portal's Start call hangs
# (measured 23 failures / 157 successes) - but that only affects INLINE
# sessions. nyx-keyd holds ONE portal session open for the whole login, so
# injection goes through its socket and returns in ~0.09s with no portal call
# at all. Measured 3/3 captures after restarting a wedged daemon.
#
# If nyx-keyd is ever stuck, the symptom is a repeating
# "portal not ready ... The connection is closed" in
# `journalctl --user -u nyx-keyd`, and the fix is
# `systemctl --user restart nyx-keyd`. No logout needed.
gesture pinch out   3  /usr/local/bin/nyshot full
gesture pinch in    3  /usr/local/bin/nyx-key alt+F4

# ---- 4-finger pinch: OUT = GNOME's Screen/Window/Selection picker,
#                      IN  = show desktop, app keeps running ----
# This line says `gui`, so you get the interactive chooser (alt+shift+F11 =
# show-screenshot-ui), NOT a silent capture. The comment above it used to claim
# this was switched to a silent `full` capture, which was never true - the line
# was left as `gui`. If that "silent capture instead" behaviour is what you
# actually want, change `gui` to `full` below.
#
# That chooser overlay is the thing that previously took over the screen and
# left screenshots unusable until dismissed. It works now that injection is
# fixed, but if it misbehaves again, `full` gives the same PNG on the clipboard
# with no overlay at all.
gesture pinch out   4  /usr/local/bin/nyshot gui
gesture pinch in    4  /usr/local/bin/nyx-key alt+F12

# ---- 4-finger HOLD (rest fingers ~0.6s, don't move): DISABLED.
# Was alt+F19, which opens GNOME's screen-recording UI (screen/monitor/region
# picker plus a notification-bar stop button). That is the "share screen"
# overlay that takes over the screen and blocks screenshots, and it was the
# most annoying binding here, so it is commented out rather than remapped.
# Uncomment to get the recorder back.
# gesture hold on+0.6 4  /usr/local/bin/nyx-key alt+F19